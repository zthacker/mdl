[workspace]
resolver = "3"
members = [
    "crates/mdl",
    "crates/mdl-testkit",
    "crates/mdl-toml",
    "crates/mdl-xtce",
    "crates/morphc",
]

[workspace.package]
edition = "2024"
rust-version = "1.88"
version = "0.1.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/zthacker/mdl"
# `mdl` and `morphc` are taken on crates.io, so the packages are named
# `morpheus-*`; the libraries keep their import names (`mdl`, `mdl_toml`,
# `mdl_xtce`) and the binary its name (`morphc`). Not published yet.
publish = false

[workspace.dependencies]
mdl = { path = "crates/mdl", package = "morpheus-mdl" }
mdl-toml = { path = "crates/mdl-toml", package = "morpheus-mdl-toml" }
mdl-xtce = { path = "crates/mdl-xtce", package = "morpheus-mdl-xtce" }
# Property-test generators, a dev-dependency only; never published.
mdl-testkit = { path = "crates/mdl-testkit" }

anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
proptest = "1.12.0"
roxmltree = "0.21.2"
ryu-js = "1.0.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_path_to_error = "0.1.20"
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
sha2 = "0.11.1"
thiserror = "2.0.21"
toml = "1.1.8"

[workspace.lints.rust]
unsafe_code = "forbid"

# `just props`: optimized, since the deep property run generates whole
# bundles, but with the overflow checks and debug assertions a release
# build drops, which are what integer edge cases trip.
[profile.props]
inherits = "release"
overflow-checks = true
debug-assertions = true
