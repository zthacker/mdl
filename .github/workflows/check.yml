# What `just check` runs (formatting, clippy, every test including the
# examples walkthrough and the README's example, and the docs), on every
# push to main and every pull request, plus the tests on the oldest Rust
# the workspace supports. On pushes to main, `just props` also runs the
# property tests at 10,000 cases each.

name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: just check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      # Fails if Cargo.lock doesn't match the manifests, so the checks below
      # build exactly the committed lockfile.
      - run: cargo fetch --locked
      - run: just check

  msrv:
    name: tests on Rust 1.88
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked

  props:
    name: property tests at 10,000 cases
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: cargo fetch --locked
      - run: just props
