# What `just check` runs (formatting, clippy, every test including the
# examples walkthrough and the README's example, the docs, and the release
# scripts' tests and check), on every push to main and every pull request,
# plus the tests on the oldest Rust the workspace supports, a build of
# every fuzz target, and the Elixir binding's checks on the oldest and newest
# Elixir it supports. On pushes to main, `just props` also runs the
# property tests at 10,000 cases each, and each fuzz target runs for a
# minute (five for the generated ones).
#
# Every action is pinned to the commit of the release named beside it, and
# every job to a runner image (ubuntu-24.04), as in release.yml; Rust comes
# from rustup, which the runners ship, and cargo-fuzz from its crates.io
# source. ubuntu-latest moved to 26.04, for which Hex builds no OTP 25.
# Rust caches are kept per image (ImageOS in their keys), so a cache built on
# one image is never restored on another.

name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Each job builds once: incremental state would only fill the caches.
  CARGO_INCREMENTAL: 0
  # A nightly known to build the fuzz harness, bumped now and then, so a
  # failure reproduces; the fuzz recipes read it.
  MDL_FUZZ_TOOLCHAIN: nightly-2026-11-04

jobs:
  check:
    name: just check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable
      # `just check` also lints the fuzz harness, which builds in its own
      # target directory.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          env-vars: ImageOS
          workspaces: |
            . -> target
            fuzz -> target
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: just@1.59.0
      # Fails if Cargo.lock doesn't match the manifests, so the checks below
      # build exactly the committed lockfile.
      - run: cargo fetch --locked
      - run: just check

  msrv:
    name: tests on Rust 1.88
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install 1.88 --profile minimal && rustup default 1.88
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          env-vars: ImageOS
      - run: cargo test --workspace --locked

  # The fuzz targets, built as the fuzz jobs build them but not run, on pull
  # requests too: a harness that stops building fails before it's merged,
  # not on main's next push.
  fuzz-build:
    name: fuzz targets build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install "$MDL_FUZZ_TOOLCHAIN" --profile minimal && rustup default "$MDL_FUZZ_TOOLCHAIN"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          env-vars: ImageOS
          workspaces: fuzz -> target
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: just@1.59.0
      # cargo-fuzz built from its crates.io source, which Cargo verifies, at a
      # version pinned with the nightly, so a failure reproduces.
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked
      - run: just fuzz-build

  # The Elixir binding's checks (`just elixir`) on the oldest Elixir and
  # Erlang/OTP it supports and the newest. Its tests build morphc and check
  # the binding's results against morphc's.
  elixir:
    name: Elixir binding on Elixir ${{ matrix.elixir }}, OTP ${{ matrix.otp }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: "1.18"
            otp: "25"
          - elixir: "1.20"
            otp: "29"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}
      # morphc, which the tests build, and the native library, each in its
      # own target directory.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          env-vars: ImageOS
          workspaces: |
            . -> target
            bindings/elixir/native/mdl_nif -> target
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: just@1.59.0
      - run: just elixir

  props:
    name: property tests at 10,000 cases
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          env-vars: ImageOS
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: just@1.59.0
      - run: cargo fetch --locked
      - run: just props

  fuzz:
    name: fuzz ${{ matrix.target }}
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target:
          [artifact, bindings, canonical, decode, decode_command, encode, layouts, read,
           shapes, timestamp, toml, units, xtce]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install "$MDL_FUZZ_TOOLCHAIN" --profile minimal && rustup default "$MDL_FUZZ_TOOLCHAIN"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          env-vars: ImageOS
          workspaces: fuzz -> target
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: just@1.59.0
      # cargo-fuzz built from its crates.io source, which Cargo verifies, at a
      # version pinned with the nightly, so a failure reproduces.
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked
      # What earlier runs grew beyond the seeds and the committed corpus,
      # saved again after this run. Not for the generated targets, which
      # keep seeds only: their corpus records the testkit's branches.
      - if: matrix.target != 'layouts' && matrix.target != 'shapes'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/cache/${{ matrix.target }}
          key: fuzz-cache-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-cache-${{ matrix.target }}-
      # 60 s a target; 300 s for the generated ones, each of whose inputs
      # builds a whole case, about 10 a second for layouts.
      - run: >-
          just fuzz ${{ matrix.target }}
          ${{ (matrix.target == 'layouts' || matrix.target == 'shapes') && 300 || 60 }} cache
      # Only what adds coverage beyond the seeds and the corpus is kept, so
      # replaying the cache can't come to fill the run.
      - if: matrix.target != 'layouts' && matrix.target != 'shapes'
        run: >-
          just fuzz-merge ${{ matrix.target }} cache/${{ matrix.target }} 0
          seeds/${{ matrix.target }} corpus/${{ matrix.target }}
      # The input that crashed, to reproduce with `cargo fuzz run`, shrink
      # with `cargo fuzz tmin` and keep in fuzz/regressions (layouts' and
      # shapes' as a unit test of the definition and payload). An input kept
      # for time (timeout-*), memory (oom-*) or a leak (leak-*) needs a unit
      # test too: the replay test has no memory limit or leak checker, and
      # gives an input a minute.
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
