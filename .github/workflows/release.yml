# Releases (RELEASING.md). On a tag v<version>: check that the tagged
# commit is on main and the tag names the workspace's version and a
# section of CHANGELOG.md, test the commit, build morphc for each platform
# and run the README's worked example with each binary, and make a draft
# GitHub release holding the archives, their SHA-256 checksums and build
# provenance attestations, for a maintainer to review and publish. Run by
# hand (workflow_dispatch), it's a dry run: the same checks and builds,
# from any branch, the archives kept as the run's artifacts, nothing
# released.
#
# Only GitHub's own actions are used, each pinned to the commit of the
# release named beside it; rustup and the gh CLI come with the runners.
# Nothing is cached, so no cache another workflow wrote reaches a release
# build.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# bash -eo pipefail for every step, rather than bash -e.
defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  # The Rust the binaries are built and the tagged commit tested with:
  # every release of a version gets the same toolchain (the archives
  # themselves aren't byte for byte reproducible). Bumped on purpose
  # (RELEASING.md), apart from CI, which tracks stable.
  RUST: "1.99.1"

jobs:
  verify:
    name: verify and test
    runs-on: ubuntu-24.04
    steps:
      # Every branch's history, for the check that the tag is on main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # A release is of reviewed, merged code: whoever can push a tag can't
      # release a commit that isn't on main.
      - name: Check the tagged commit is on main
        if: github.event_name == 'push'
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "$GITHUB_REF_NAME is $(git rev-parse HEAD), which isn't on main"
            exit 1
          fi
      - name: Install Rust
        run: rustup toolchain install "$RUST" --profile minimal && rustup default "$RUST"
      # On a tag, the tag must name the workspace's version; run by hand,
      # the workspace's version is checked as if tagged.
      - name: Check the version, the changelog and the lockfile
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            scripts/release.sh check "$GITHUB_REF_NAME"
          else
            scripts/release.sh check
          fi
      - name: Test
        run: cargo test --workspace --locked

  build:
    name: morphc for ${{ matrix.target }}
    needs: verify
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST" --profile minimal --target "$TARGET"
          rustup default "$RUST"
      # Rust's musl targets bring their own musl, and morphc has no C, so
      # nothing else is installed. A dependency that compiles C would need
      # musl-gcc (Ubuntu's musl-tools), or the check below fails.
      - name: Build
        run: cargo build --release --locked -p morpheus-morphc --target "$TARGET"
      # A Linux binary runs on any distribution only if nothing is linked
      # at run time.
      - name: Check the binary
        run: |
          bin="target/$TARGET/release/morphc"
          linkage=$(file -b "$bin")
          echo "$linkage"
          if [ "$RUNNER_OS" = Linux ]; then
            case "$linkage" in
              *"statically linked"* | *"static-pie linked"*) ;;
              *)
                echo "$bin isn't statically linked"
                exit 1
                ;;
            esac
          fi
          "$bin" --version
      # The tests ran on x86_64 Linux with glibc; this runs each released
      # binary through the README's worked example, the commands and JSON
      # the walkthrough test checks (the_readmes_json_is_what_morphc_prints).
      - name: Run the README's worked example
        run: |
          morphc="$PWD/target/$TARGET/release/morphc"
          example="$RUNNER_TEMP/example"
          mkdir "$example"
          cp -R examples/beacon "$example/"
          (
            cd "$example"
            "$morphc" build beacon/beacon.toml --out store
            "$morphc" decode store --family beacon --hex 070b1901 \
              --bindings beacon/bindings.toml --time 2026-06-01T12:00:00Z \
              --raw --format json > decoded.json
          )
          python3 -I - README.md "$example/decoded.json" <<'EOF'
          import json, sys
          lines = open(sys.argv[1], encoding="utf-8").read().splitlines()
          start = lines.index("```json") + 1
          shown = json.loads("\n".join(lines[start:lines.index("```", start)]))
          decoded = json.load(open(sys.argv[2], encoding="utf-8"))
          printed = decoded["decode"]["messages"][0]["telemetry"]
          # As text: Python's == takes true for 1 and 1 for 1.0.
          def text(value):
              return json.dumps(value, sort_keys=True)
          if text(printed) != text(shown):
              sys.exit("morphc decoded the README's beacon as\n" + json.dumps(printed, indent=2))
          print("the README's worked example decodes as shown")
          EOF
      - name: Package
        run: |
          name="morphc-$(scripts/release.sh version)-$TARGET"
          mkdir "$name"
          cp "target/$TARGET/release/morphc" LICENSE-MIT LICENSE-APACHE README.md "$name/"
          # Without macOS's extended attributes (GNU tar warns about them)
          # or AppleDouble files.
          COPYFILE_DISABLE=1 tar --no-xattrs -czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          cat "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: morphc-${{ matrix.target }}
          path: morphc-*.tar.gz*
          if-no-files-found: error

  # The Elixir binding's precompiled native libraries will be built here
  # too, a job per platform like build's, and attached by release.

  release:
    name: draft the release
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: morphc-*
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum --check ./*.sha256
          sha256sum morphc-*.tar.gz > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/morphc-*.tar.gz
      # A draft: a maintainer reads it over and publishes it.
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/release.sh notes "$GITHUB_REF_NAME" > notes.md
          prerelease=()
          case "$GITHUB_REF_NAME" in
            *-*) prerelease=(--prerelease) ;;
          esac
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --draft --verify-tag "${prerelease[@]}" \
            --title "MDL ${GITHUB_REF_NAME#v}" \
            --notes-file notes.md \
            dist/morphc-*.tar.gz dist/morphc-*.tar.gz.sha256 dist/SHA256SUMS
