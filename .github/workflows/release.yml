# Releases (RELEASING.md). When a push to main changes the workspace's
# version: check that the version is untagged and has a section of
# CHANGELOG.md, test the commit, build morphc for each platform and run the
# README's worked example with each binary, build the Elixir binding's
# native library for each platform and run the binding's tests on it, and
# make a draft GitHub release of that commit holding the archives, their
# SHA-256 checksums and build provenance attestations, for a maintainer to
# review and publish. Publishing it creates the tag v<version>. Run by hand
# (workflow_dispatch), it's a dry run of the branch's head: the same checks
# and builds, the archives kept as the run's artifacts, nothing released;
# or, on main with "release" checked, a release of main's head, for a
# version a push didn't release (a run that failed, a draft deleted). What
# each run does is scripts/release.sh plan's, which its tests cover. A
# release is always of the commit the run is for, so that its provenance
# names the commit it was built from.
#
# GitHub's own actions are used, and erlef/setup-beam for Elixir on macOS,
# each pinned to the commit of the release named beside it; rustup and the
# gh CLI come with the runners.
# Nothing is cached, so no cache another workflow wrote reaches a release
# build.

name: release

on:
  # Only a push that changes Cargo.toml can change the version.
  push:
    branches: [main]
    paths: [Cargo.toml]
  workflow_dispatch:
    inputs:
      release:
        description: "Draft a release of main's head (on main only, for a version not yet tagged)"
        type: boolean
        default: false

permissions:
  contents: read

# bash -eo pipefail for every step, rather than bash -e.
defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  # The Rust the binaries are built and the tagged commit tested with:
  # every release of a version gets the same toolchain (the archives
  # themselves aren't byte for byte reproducible). Bumped on purpose
  # (RELEASING.md), apart from CI, which tracks stable.
  RUST: "1.99.1"

jobs:
  # What this run does (scripts/release.sh plan): release, dry-run or skip,
  # and the commit and version it's for. A push that leaves the version as
  # it was stops here.
  plan:
    name: plan
    runs-on: ubuntu-24.04
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      commit: ${{ steps.plan.outputs.commit }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      # Every commit and tag, to read the version before the push and to
      # see whether the version is tagged.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Plan
        id: plan
        env:
          BEFORE: ${{ github.event.before }}
          RELEASE: ${{ inputs.release }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            plan=$(scripts/release.sh plan push "$BEFORE" "$GITHUB_SHA")
          else
            plan=$(scripts/release.sh plan dispatch "$GITHUB_SHA" "$GITHUB_REF_NAME" "${RELEASE:-false}")
          fi
          echo "$plan"
          echo "$plan" >> "$GITHUB_OUTPUT"

  verify:
    name: verify and test
    needs: plan
    if: needs.plan.outputs.mode != 'skip'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install "$RUST" --profile minimal && rustup default "$RUST"
      # The tag the release will have names the commit's version, as for a
      # dry run.
      - name: Check the version, the changelog and the lockfile
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: scripts/release.sh check "v$VERSION"
      - name: Test
        run: cargo test --workspace --locked

  build:
    name: morphc for ${{ matrix.target }}
    needs: [plan, verify]
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST" --profile minimal --target "$TARGET"
          rustup default "$RUST"
      # Rust's musl targets bring their own musl, and morphc has no C, so
      # nothing else is installed. A dependency that compiles C would need
      # musl-gcc (Ubuntu's musl-tools), or the check below fails.
      - name: Build
        run: cargo build --release --locked -p morpheus-morphc --target "$TARGET"
      # A Linux binary runs on any distribution only if nothing is linked
      # at run time.
      - name: Check the binary
        run: |
          bin="target/$TARGET/release/morphc"
          linkage=$(file -b "$bin")
          echo "$linkage"
          if [ "$RUNNER_OS" = Linux ]; then
            case "$linkage" in
              *"statically linked"* | *"static-pie linked"*) ;;
              *)
                echo "$bin isn't statically linked"
                exit 1
                ;;
            esac
          fi
          "$bin" --version
      # The tests ran on x86_64 Linux with glibc; this runs each released
      # binary through the README's worked example, the commands and JSON
      # the walkthrough test checks (the_readmes_json_is_what_morphc_prints).
      - name: Run the README's worked example
        run: |
          morphc="$PWD/target/$TARGET/release/morphc"
          example="$RUNNER_TEMP/example"
          mkdir "$example"
          cp -R examples/beacon "$example/"
          (
            cd "$example"
            "$morphc" build beacon/beacon.toml --out store
            "$morphc" decode store --family beacon --hex 070b1901 \
              --bindings beacon/bindings.toml --time 2026-06-01T12:00:00Z \
              --raw --format json > decoded.json
          )
          python3 -I - README.md "$example/decoded.json" <<'EOF'
          import json, sys
          lines = open(sys.argv[1], encoding="utf-8").read().splitlines()
          start = lines.index("```json") + 1
          shown = json.loads("\n".join(lines[start:lines.index("```", start)]))
          decoded = json.load(open(sys.argv[2], encoding="utf-8"))
          printed = decoded["decode"]["messages"][0]["telemetry"]
          # As text: Python's == takes true for 1 and 1 for 1.0.
          def text(value):
              return json.dumps(value, sort_keys=True)
          if text(printed) != text(shown):
              sys.exit("morphc decoded the README's beacon as\n" + json.dumps(printed, indent=2))
          print("the README's worked example decodes as shown")
          EOF
      - name: Package
        run: |
          name="morphc-$(scripts/release.sh version)-$TARGET"
          mkdir "$name"
          cp "target/$TARGET/release/morphc" LICENSE-MIT LICENSE-APACHE README.md "$name/"
          # Without macOS's extended attributes (GNU tar warns about them)
          # or AppleDouble files.
          COPYFILE_DISABLE=1 tar --no-xattrs -czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          cat "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: morphc-${{ matrix.target }}
          path: morphc-*.tar.gz*
          if-no-files-found: error

  # The Elixir binding's native library for each platform it's precompiled
  # for, packaged as rustler_precompiled downloads it, checked for what it
  # needs of the system, and the binding's tests run on the packaged library
  # there, loaded as a Hex install would load it (scripts/nif.sh). Linux
  # libraries build and test in images pinned by digest, through docker,
  # with Rust from a pinned rustup (scripts/install-rust.sh): glibc ones
  # build on AlmaLinux 8, so they load on glibc 2.28 and later, and test on
  # Elixir's Debian image; musl ones build and test on Elixir's Alpine
  # image. Every platform tests on the oldest Elixir and OTP the binding
  # supports.
  nif:
    name: Elixir native library for ${{ matrix.target }}
    needs: [plan, verify]
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-apple-darwin
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    env:
      TARGET: ${{ matrix.target }}
      ALMALINUX: almalinux@sha256:768bedc30fe0a536adb0a65d2eddb7caad364e514fbddd0ae9e026975f590342 # 8
      ELIXIR: elixir@sha256:451168956c70241c2d8f92c601c0e6239ace987c49b08aac0f5c55f5c9e6bded # 1.18-otp-25
      ELIXIR_ALPINE: elixir@sha256:fa800cd84a38c049fbbf0550c4ab48bc7b77b9c47822511cfed5fa33ea848bf7 # 1.18-otp-25-alpine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false
      - name: Build (glibc, on AlmaLinux 8)
        if: endsWith(matrix.target, '-linux-gnu')
        run: >-
          docker run --rm -v "$PWD:/src" -w /src -e RUST -e TARGET "$ALMALINUX"
          bash -euc 'dnf install -y -q gcc tar gzip && scripts/install-rust.sh
          && . "$HOME/.cargo/env" && scripts/nif.sh build "$TARGET"'
      - name: Test (glibc)
        if: endsWith(matrix.target, '-linux-gnu')
        run: >-
          docker run --rm -v "$PWD:/src" -w /src -e RUST -e TARGET "$ELIXIR"
          bash -euc 'scripts/install-rust.sh && . "$HOME/.cargo/env"
          && mix local.hex --force && mix local.rebar --force
          && scripts/nif.sh test "$TARGET"'
      - name: Build and test (musl, on Alpine)
        if: endsWith(matrix.target, '-linux-musl')
        run: >-
          docker run --rm -v "$PWD:/src" -w /src -e RUST -e TARGET "$ELIXIR_ALPINE"
          sh -euc 'apk add -q bash curl gcc musl-dev && scripts/install-rust.sh
          && . "$HOME/.cargo/env" && mix local.hex --force && mix local.rebar --force
          && scripts/nif.sh build "$TARGET" && scripts/nif.sh test "$TARGET"'
      - name: Install Rust (macOS)
        if: runner.os == 'macOS'
        run: |
          rustup toolchain install "$RUST" --profile minimal --target "$TARGET"
          rustup default "$RUST"
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        if: runner.os == 'macOS'
        with:
          otp-version: "25"
          elixir-version: "1.18"
      - name: Build and test (macOS)
        if: runner.os == 'macOS'
        run: |
          scripts/nif.sh build "$TARGET"
          scripts/nif.sh test "$TARGET"
      # On the runner, with its binutils (or Xcode's otool on macOS).
      - name: Check what the library needs of the system
        run: scripts/nif.sh check "$TARGET"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nif-${{ matrix.target }}
          path: dist/libmdl_nif-*.tar.gz*
          if-no-files-found: error

  release:
    name: draft the release
    if: needs.plan.outputs.mode == 'release'
    needs: [plan, build, nif]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: morphc-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: nif-*
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum --check ./*.sha256
          sha256sum morphc-*.tar.gz libmdl_nif-*.tar.gz > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/morphc-*.tar.gz
            dist/libmdl_nif-*.tar.gz
      # A draft of the commit: a maintainer reads it over and publishes it,
      # which creates the tag there. An earlier run's draft for the version
      # has no tag yet, so the plan can't see it; it's found here, where
      # drafts can be listed. The listing is read whole before it's
      # searched: grep -q would close the pipe at the first match, and a
      # paginating gh killed by that would read, under pipefail, as no
      # match.
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
          COMMIT: ${{ needs.plan.outputs.commit }}
        run: |
          tag="v$VERSION"
          existing=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[].tag_name')
          if grep -qxF "$tag" <<< "$existing"; then
            echo "a release of $tag exists already, perhaps an earlier run's draft; delete the draft to release again"
            exit 1
          fi
          scripts/release.sh notes "$tag" > notes.md
          prerelease=()
          case "$tag" in
            *-*) prerelease=(--prerelease) ;;
          esac
          # GitHub refuses this token a release whose commit's workflow
          # files differ from main's (its API answers 404 or 403), which can
          # happen when such a change reaches main during the run; the
          # failure says so when that's the case.
          if ! gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$COMMIT" \
            --draft "${prerelease[@]}" \
            --title "MDL $VERSION" \
            --notes-file notes.md \
            dist/morphc-*.tar.gz dist/morphc-*.tar.gz.sha256 \
            dist/libmdl_nif-*.tar.gz dist/libmdl_nif-*.tar.gz.sha256 dist/SHA256SUMS; then
            git fetch --quiet --no-tags --depth=1 origin main
            if ! git diff --quiet "$COMMIT" FETCH_HEAD -- .github/workflows; then
              echo "main's workflow files changed after $COMMIT, and GitHub refuses the workflow's" \
                "token a release of a commit whose workflow files differ from main's; release" \
                "main's head by hand (RELEASING.md, If something goes wrong)"
            fi
            exit 1
          fi
