# A shared library for musl links musl dynamically, as the system it loads
# into does (rust-lang/rust#59302; rustler_precompiled's guide).
[target.x86_64-unknown-linux-musl]
rustflags = ["-C", "target-feature=-crt-static"]

[target.aarch64-unknown-linux-musl]
rustflags = ["-C", "target-feature=-crt-static"]
