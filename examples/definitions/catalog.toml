# The canonical model: every canonical param any set maps to, with one type
# and one unit each. Definition sets convert into these. Canonical names are a schema
# (DDIA Ch. 5): never repurpose one; deprecate it and add a new one.
#
# Limits are defaults for every asset. Bus voltage has none, because a 2-cell
# satellite (7 V), a 28 V satellite and a 4S drone (15 V) share the param;
# per-asset limits come later.

# ---- Power -------------------------------------------------------------------

[[canonical]]
name        = "eps.bus_voltage"
type        = "f64"
unit        = "V"
description = "Main power bus voltage"

[[canonical]]
name        = "eps.batt_current"
type        = "f64"
unit        = "A"
description = "Battery current; positive is charging on the satellites, discharging on UAV-1"

[[canonical]]
name        = "eps.solar_current"
type        = "f64"
unit        = "A"
description = "Solar array output current"

[[canonical]]
name        = "eps.batt_temp"
type        = "f64"
unit        = "degC"
limits      = { red_low = -10.0, yellow_low = 0.0, yellow_high = 35.0, red_high = 45.0 }
description = "Battery temperature"

[[canonical]]
name        = "eps.batt_remaining"
type        = "f64"
unit        = "%"
limits      = { red_low = 15.0, yellow_low = 30.0 }
description = "Battery charge remaining"

[[canonical]]
name        = "eps.mode"
type        = "enum"
states      = ["SAFE", "NOMINAL", "PAYLOAD"]
description = "Satellite power mode, as the asset reports it"

# ---- System ------------------------------------------------------------------

[[canonical]]
name        = "sys.state"
type        = "enum"
states      = ["UNINIT", "BOOT", "CALIBRATING", "STANDBY", "ACTIVE", "CRITICAL", "EMERGENCY", "POWEROFF", "FLIGHT_TERMINATION"]
description = "Vehicle state (MAVLink MAV_STATE names)"

# ---- Attitude ----------------------------------------------------------------

[[canonical]]
name        = "adcs.attitude"
type        = "quat"
frame       = "ECI_J2000"
description = "Attitude quaternion, scalar first, rotating ECI J2000 into the body frame"

[[canonical]]
name        = "adcs.rate"
type        = "vec3"
unit        = "deg/s"
frame       = "BODY"
description = "Body angular rates"

[[canonical]]
name        = "att.roll"
type        = "f64"
unit        = "deg"
description = "Roll (Euler ZYX from NED)"

[[canonical]]
name        = "att.pitch"
type        = "f64"
unit        = "deg"
description = "Pitch (Euler ZYX from NED)"

[[canonical]]
name        = "att.yaw"
type        = "f64"
unit        = "deg"
description = "Yaw (Euler ZYX from NED)"

# ---- Navigation --------------------------------------------------------------

[[canonical]]
name        = "nav.lat"
type        = "f64"
unit        = "deg"
description = "Geodetic latitude"

[[canonical]]
name        = "nav.lon"
type        = "f64"
unit        = "deg"
description = "Geodetic longitude"

[[canonical]]
name        = "nav.alt_msl"
type        = "f64"
unit        = "m"
description = "Altitude above mean sea level"

[[canonical]]
name        = "nav.pos_ecef"
type        = "vec3"
unit        = "m"
frame       = "ECEF"
description = "Position, Earth-centred Earth-fixed (canonical for every asset)"

[[canonical]]
name        = "nav.vel_ecef"
type        = "vec3"
unit        = "m/s"
frame       = "ECEF"
description = "Velocity, Earth-centred Earth-fixed"
