# Firmware 1: bus voltage in millivolts.

mdl_version = "2.0"

[[sets]]
name    = "beacon_v1"
family  = "beacon"
version = 1

[[sets.packets]]
name   = "BEACON"
length = { kind = "exact", bytes = 5 }

[[sets.packets.entries]]
kind        = "field"
name        = "bus_mv"
type        = "uint"
offset_bits = 24
size_bits   = 16
unit        = "mV"
canonical   = "eps.bus_voltage"
